<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест DeepSeek API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
        .result { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 5px; white-space: pre-wrap; }
        .error { background: #ffcccc; }
        .success { background: #ccffcc; }
        .info { background: #ccccff; }
        .streaming { background: #ffffcc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Тест DeepSeek API</h1>
        
        <h2>1. Тест обычного запроса</h2>
        <button onclick="testRegular()">Тест без стриминга</button>
        <div id="regular-result"></div>
        
        <h2>2. Тест потокового запроса</h2>
        <button onclick="testStreaming()">Тест со стримингом</button>
        <div id="streaming-result"></div>
        
        <h2>3. Тест полного запроса как в приложении</h2>
        <button onclick="testFullRequest()">Тест как в приложении</button>
        <div id="full-result"></div>
    </div>

    <script>
        const API_KEY = 'sk-f8c6a93eb5394fbe8ea02405d2f45297';
        
        async function testRegular() {
            const result = document.getElementById('regular-result');
            result.innerHTML = '<div class="result info">Тестирую обычный запрос...</div>';
            
            try {
                console.log('🚀 Отправляю обычный запрос...');
                
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{role: 'user', content: 'Привет! Ответь одним предложением.'}],
                        max_tokens: 100,
                        temperature: 0.7,
                        stream: false
                    })
                });
                
                console.log('📡 Статус ответа:', response.status);
                console.log('📡 Заголовки:', [...response.headers.entries()]);
                
                const text = await response.text();
                console.log('📡 Сырой ответ:', text);
                
                if (response.ok) {
                    const data = JSON.parse(text);
                    const reply = data.choices?.[0]?.message?.content || 'Нет ответа';
                    result.innerHTML = `<div class="result success"><strong>✅ Обычный запрос работает!</strong><br>Ответ: ${reply}</div>`;
                } else {
                    result.innerHTML = `<div class="result error"><strong>❌ Ошибка ${response.status}:</strong><br>${text}</div>`;
                }
            } catch (e) {
                console.error('❌ Ошибка:', e);
                result.innerHTML = `<div class="result error">❌ Ошибка: ${e.message}</div>`;
            }
        }
        
        async function testStreaming() {
            const result = document.getElementById('streaming-result');
            result.innerHTML = '<div class="result info">Тестирую потоковый запрос...</div>';
            
            try {
                console.log('🚀 Отправляю потоковый запрос...');
                
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{role: 'user', content: 'Привет! Расскажи коротко о себе.'}],
                        max_tokens: 200,
                        temperature: 0.7,
                        stream: true
                    })
                });
                
                console.log('📡 Статус ответа:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';
                
                result.innerHTML = '<div class="result streaming">Получаю потоковые данные...</div>';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    console.log('📦 Получен chunk:', chunk);
                    
                    const lines = chunk.split('\\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            console.log('📄 Обрабатываю данные:', data);
                            
                            if (data === '[DONE]') {
                                console.log('✅ Поток завершен');
                                continue;
                            }
                            
                            try {
                                const parsed = JSON.parse(data);
                                const content = parsed.choices?.[0]?.delta?.content;
                                if (content) {
                                    fullResponse += content;
                                    result.innerHTML = `<div class="result streaming"><strong>Поток:</strong><br>${fullResponse}</div>`;
                                }
                            } catch (e) {
                                console.log('⚠️ Ошибка парсинга:', e.message);
                            }
                        }
                    }
                }
                
                result.innerHTML = `<div class="result success"><strong>✅ Потоковый запрос завершен!</strong><br><br>${fullResponse}</div>`;
                
            } catch (e) {
                console.error('❌ Ошибка потока:', e);
                result.innerHTML = `<div class="result error">❌ Ошибка: ${e.message}</div>`;
            }
        }
        
        async function testFullRequest() {
            const result = document.getElementById('full-result');
            result.innerHTML = '<div class="result info">Тестирую полный запрос как в приложении...</div>';
            
            try {
                console.log('🚀 Отправляю запрос как в приложении...');
                
                // Эмулируем точно такой же запрос как в useSimpleChat
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{ role: 'user', content: 'и че думал думал и не придумал?' }],
                        max_tokens: 1000,
                        temperature: 0.7,
                        stream: true
                    })
                });
                
                console.log('📡 API Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                
                // Обрабатываем потоковый ответ
                const reader = response.body?.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';
                
                if (!reader) {
                    throw new Error('No response body');
                }
                
                result.innerHTML = '<div class="result streaming">Обрабатываем поток как в приложении...</div>';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            
                            if (data === '[DONE]') {
                                continue;
                            }
                            
                            try {
                                const parsed = JSON.parse(data);
                                const content = parsed.choices?.[0]?.delta?.content;
                                
                                if (content) {
                                    fullResponse += content;
                                    result.innerHTML = `<div class="result streaming"><strong>Ответ в реальном времени:</strong><br>${fullResponse}</div>`;
                                }
                            } catch (e) {
                                // Игнорируем ошибки парсинга
                                console.log('⚠️ Пропущена ошибка парсинга');
                            }
                        }
                    }
                }
                
                result.innerHTML = `<div class="result success"><strong>✅ Полный запрос завершен успешно!</strong><br><br>${fullResponse}</div>`;
                
            } catch (e) {
                console.error('❌ Ошибка полного запроса:', e);
                result.innerHTML = `<div class="result error">❌ Ошибка: ${e.message}</div>`;
            }
        }
        
        // Проверка при загрузке
        window.onload = () => {
            console.log('🧪 Тестовая страница загружена');
            console.log('🔑 API ключ:', API_KEY.substring(0, 10) + '...');
        };
    </script>
</body>
</html>
