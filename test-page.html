<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Chat System - Test Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
        }
        .success {
            background-color: rgba(40, 167, 69, 0.3);
            border: 1px solid #28a745;
        }
        .error {
            background-color: rgba(220, 53, 69, 0.3);
            border: 1px solid #dc3545;
        }
        .links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .link-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .link-card a {
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
        }
        .link-card p {
            margin: 10px 0 0 0;
            opacity: 0.8;
            font-size: 0.9em;
        }
        .api-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.9em;
        }
        .loading {
            text-align: center;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 API Chat System</h1>
        
        <div id="status" class="status">
            <div class="loading">🔄 Checking API status...</div>
        </div>

        <div class="links">
            <div class="link-card">
                <a href="/docs" target="_blank">📚 API Documentation</a>
                <p>Interactive Swagger UI for API testing</p>
            </div>
            
            <div class="link-card">
                <a href="/health" target="_blank">🏥 Health Check</a>
                <p>API health and provider status</p>
            </div>
            
            <div class="link-card">
                <a href="/providers" target="_blank">🔌 Providers</a>
                <p>Available AI providers and models</p>
            </div>
            
            <div class="link-card">
                <a href="/models" target="_blank">🤖 Models</a>
                <p>All supported AI models</p>
            </div>
            
            <div class="link-card">
                <a href="/app" target="_blank">💬 Chat App</a>
                <p>Main chat application interface</p>
            </div>
        </div>

        <div class="api-info" id="apiInfo" style="display: none;">
            <h3>📊 API Information</h3>
            <pre id="apiData"></pre>
        </div>
    </div>

    <script>
        async function checkAPI() {
            try {
                const response = await fetch('/');
                const data = await response.json();
                
                const statusDiv = document.getElementById('status');
                const apiInfoDiv = document.getElementById('apiInfo');
                const apiDataPre = document.getElementById('apiData');
                
                if (response.ok && data.status === 'running') {
                    statusDiv.innerHTML = `
                        <div class="success">
                            ✅ API is running successfully!<br>
                            <small>Version: ${data.version} | Providers: ${data.providers.length}</small>
                        </div>
                    `;
                    
                    apiInfoDiv.style.display = 'block';
                    apiDataPre.textContent = JSON.stringify(data, null, 2);
                } else {
                    statusDiv.innerHTML = `
                        <div class="error">
                            ❌ API is not responding correctly
                        </div>
                    `;
                }
            } catch (error) {
                const statusDiv = document.getElementById('status');
                statusDiv.innerHTML = `
                    <div class="error">
                        🚫 Failed to connect to API: ${error.message}
                    </div>
                `;
            }
        }

        // Check API status on page load
        checkAPI();
    </script>
</body>
</html>
