<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Chat System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .chat-header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8fafc;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            max-width: 80%;
        }
        
        .message.user {
            margin-left: auto;
        }
        
        .message.assistant {
            margin-right: auto;
        }
        
        .message-content {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .message.user .message-content {
            background: #4f46e5;
            color: white;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #1f2937;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .chat-input:focus {
            border-color: #4f46e5;
        }
        
        .send-button {
            padding: 12px 24px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .send-button:hover {
            background: #4338ca;
        }
        
        .send-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .provider-selector {
            margin-bottom: 10px;
        }
        
        .provider-selector select {
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 12px;
            color: #6b7280;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 10px;
            color: #6b7280;
            font-style: italic;
        }
        
        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #6b7280;
        }
        
        @media (max-width: 640px) {
            .chat-container {
                width: 95%;
                height: 95vh;
            }
            
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 API Chat System</h1>
            <p>Powered by AI • DeepSeek & OpenAI</p>
        </div>
        
        <div class="chat-messages" id="messages">
            <div class="message assistant">
                <div class="message-content">
                    👋 Привет! Я AI-ассистент. Задайте мне любой вопрос, и я постараюсь помочь вам.
                </div>
            </div>
        </div>
        
        <div class="chat-input-area">
            <div class="provider-selector">
                <select id="provider">
                    <option value="deepseek">🚀 DeepSeek (Fast)</option>
                    <option value="openai">🧠 OpenAI GPT-4</option>
                </select>
            </div>
            <div class="error" id="error" style="display: none;"></div>
            <div class="loading" id="loading">🤖 AI думает...</div>
            <div class="input-container">
                <input type="text" class="chat-input" id="messageInput" placeholder="Напишите сообщение..." maxlength="1000">
                <button class="send-button" id="sendButton">Отправить</button>
            </div>
            <div class="status" id="status">Готов к работе</div>
        </div>
    </div>

    <script>
        class ChatApp {
            constructor() {
                this.messagesContainer = document.getElementById('messages');
                this.messageInput = document.getElementById('messageInput');
                this.sendButton = document.getElementById('sendButton');
                this.providerSelect = document.getElementById('provider');
                this.errorDiv = document.getElementById('error');
                this.loadingDiv = document.getElementById('loading');
                this.statusDiv = document.getElementById('status');
                
                this.init();
            }
            
            init() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                
                // Check API status on load
                this.checkStatus();
            }
            
            async checkStatus() {
                try {
                    const response = await fetch('/health');
                    const data = await response.json();
                    this.statusDiv.textContent = `✅ API подключен • Провайдеры: ${data.providers?.join(', ') || 'нет данных'}`;
                    this.statusDiv.style.color = '#10b981';
                } catch (error) {
                    this.statusDiv.textContent = '❌ Ошибка подключения к API';
                    this.statusDiv.style.color = '#dc2626';
                }
            }
            
            addMessage(content, role = 'user') {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role}`;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = content;
                
                messageDiv.appendChild(contentDiv);
                this.messagesContainer.appendChild(messageDiv);
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }
            
            showError(message) {
                this.errorDiv.textContent = `❌ ${message}`;
                this.errorDiv.style.display = 'block';
                setTimeout(() => {
                    this.errorDiv.style.display = 'none';
                }, 5000);
            }
            
            setLoading(loading) {
                this.loadingDiv.style.display = loading ? 'block' : 'none';
                this.sendButton.disabled = loading;
                this.messageInput.disabled = loading;
            }
            
            async sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message) return;
                
                // Add user message
                this.addMessage(message, 'user');
                this.messageInput.value = '';
                this.setLoading(true);
                
                try {
                    const provider = this.providerSelect.value;
                    const model = provider === 'deepseek' ? 'deepseek-chat' : 'gpt-4';
                    
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            messages: [
                                { role: 'user', content: message }
                            ],
                            model: model,
                            temperature: 0.7,
                            max_tokens: 1000
                        })
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    this.addMessage(data.message, 'assistant');
                    
                } catch (error) {
                    console.error('Chat error:', error);
                    this.showError(error.message || 'Ошибка отправки сообщения');
                    this.addMessage('❌ Извините, произошла ошибка. Попробуйте еще раз.', 'assistant');
                } finally {
                    this.setLoading(false);
                }
            }
        }
        
        // Initialize the chat app
        document.addEventListener('DOMContentLoaded', () => {
            new ChatApp();
        });
    </script>
</body>
</html>
