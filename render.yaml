services:
  # Unified Full-Stack Service with Triple Fallback
  - type: web
    name: api-chat-system
    runtime: python3
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements-ultra.txt || pip install -r requirements-minimal.txt || pip install -r requirements.txt
      cd frontend
      npm install
      npm run build
    startCommand: python debug_versions.py && python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    env:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
    healthCheckPath: /health
