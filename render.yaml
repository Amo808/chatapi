services:
  # Unified Full-Stack Service with Triple Fallback
  - type: web
    name: api-chat-system
    runtime: python3
    buildCommand: |
      # Install Python dependencies
      pip install --upgrade pip
      pip install -r requirements-ultra.txt || pip install -r requirements-minimal.txt || pip install -r requirements.txt
      
      # Check if pre-built frontend exists (committed to git)
      ls -la frontend/out/ || echo "Pre-built frontend not found - using static fallback"
      echo "Build complete - using pre-built frontend from git"
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    env:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
    healthCheckPath: /health
